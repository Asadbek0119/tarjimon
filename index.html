<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjimon</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarjimon">
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#111827;--muted:#6b7280;--main:#2563eb;--line:#e5e7eb;--soft:#eef2ff}
:root.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--soft:#27344f}
html{font-size:calc(16px * var(--fs,1))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:var(--text)}
button{cursor:pointer;border:0;border-radius:12px;background:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 6px;max-width:680px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:1.2rem;margin:0}
#dirBtn{background:var(--main);color:#fff;padding:9px 14px;border-radius:20px;font-weight:600;font-size:.9rem}
main{max-width:680px;margin:0 auto;padding:4px 14px 14px}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:max(16px,1.1rem);outline:none}
.inp:focus{border-color:var(--main)}
.sq{width:48px;height:48px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.w{font-weight:700;font-size:1.1rem}
.t{margin-top:4px;font-size:1.05rem;line-height:1.5}
.t1 small{color:var(--muted);font-size:.8rem}
.tag{background:var(--soft);color:var(--main);font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:8px}
.ib{background:var(--bg);border:1px solid var(--line);padding:6px 11px;font-size:1rem}
.ib.on{color:#f59e0b}
.hint,.cnt{color:var(--muted);font-size:.9rem;margin:12px 2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{flex:none;white-space:nowrap;background:var(--soft);padding:7px 13px;border-radius:18px;font-size:.92rem}
.chip.act{background:var(--main);color:#fff}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.lt{min-width:40px;height:38px;background:var(--card);border:1px solid var(--line);font-weight:600;padding:0 10px}
.lt.act{background:var(--main);color:#fff;border-color:var(--main)}
.btn{background:var(--main);color:#fff;padding:12px 16px;font-weight:600;width:100%;margin-top:10px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.sec-t{font-weight:700;margin:18px 2px 4px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.warn{background:#fef3c7;color:#78350f;border-radius:12px;padding:12px;margin-top:10px;font-size:.95rem;line-height:1.4}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs button{flex:1;padding:8px 2px 7px;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:0}
.tabs button span{font-size:1.35rem;line-height:1.2}
.tabs button.act{color:var(--main);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;z-index:20;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
#toast.on{opacity:.95}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🌐 Tarjimon</h1><button id="dirBtn"></button></div>
  <div id="catBar" class="strip" hidden></div>
</header>
<main>
  <section class="view" id="v-search">
    <div class="row">
      <input class="inp" id="q" type="search" placeholder="So'z yozing..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="sq" id="mic" title="Ovoz bilan">🎤</button>
    </div>
    <div id="results"></div>
  </section>
  <section class="view" id="v-list" hidden>
    <input class="inp" id="lf" type="search" placeholder="Lug'atdan qidirish..." autocomplete="off" style="width:100%">
    <div class="letters" id="letters"></div>
    <div class="cnt" id="lcnt"></div>
    <div id="lres"></div>
  </section>
  <section class="view" id="v-fav" hidden><div id="fres"></div></section>
  <section class="view" id="v-hist" hidden><div id="hres"></div></section>
  <section class="view" id="v-set" hidden><div id="sres"></div></section>
</main>
<nav class="tabs">
  <button data-v="search"><span>🔍</span>Qidiruv</button>
  <button data-v="list"><span>📚</span>Lug'at</button>
  <button data-v="fav"><span>⭐</span>Sevimli</button>
  <button data-v="hist"><span>🕘</span>Tarix</button>
  <button data-v="set"><span>⚙️</span>Sozlama</button>
</nav>
<div id="toast"></div>

<script>
/* ================= YORDAMCHI ================= */
const $=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);
  for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e[k]=a[k];else e.setAttribute(k,a[k]);}
  c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x);});return e;};
const ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1900);}

/*LOGIC-START*/
const CYR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"'","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o'","қ":"q","ғ":"g'","ҳ":"h"};
const norm=s=>{s=String(s).toLowerCase();
  if(/[а-яёўқғҳ]/.test(s))s=s.replace(/[а-яёўқғҳ]/g,c=>CYR[c]??c);
  return s.replace(/[ʻʼ`’‘´]/g,"'").replace(/\s+/g," ").trim();};
const coll=new Intl.Collator("en");
let entries=[],maps={en:new Map(),uz:new Map()},keys={en:[],uz:[]},cats=[],catCount={},cat="";
const other=d=>d==="en"?"uz":"en";
function add(d,w,t,n,c){const k=norm(w);if(!k)return;let o=maps[d].get(k);
  if(!o){o={w:String(w).trim(),items:[]};maps[d].set(k,o);}
  if(!o.items.some(i=>i.t===t&&i.c===c))o.items.push({t,n,c});}
function build(){
  maps={en:new Map(),uz:new Map()};catCount={};
  for(const x of entries){add("en",x.e,x.u,x.n,x.c);add("uz",x.u,x.e,x.n,x.c);catCount[x.c]=(catCount[x.c]||0)+1;}
  cats=Object.keys(catCount);if(cat&&!cats.includes(cat))cat="";
  for(const d of["en","uz"])keys[d]=[...maps[d].keys()].sort(coll.compare);}
const has=o=>!cat||o.items.some(i=>i.c===cat);
const visibleKeys=d=>keys[d].filter(k=>has(maps[d].get(k)));
function letterOf(d,k){
  if(d==="uz")for(const p of["o'","g'","sh","ch"])if(k.startsWith(p))return p[0].toUpperCase()+p[1];
  const c=k[0];return c&&/\p{L}/u.test(c)?c.toUpperCase():"#";}
function lettersOf(d,list){
  return[...new Set(list.map(k=>letterOf(d,k)))].sort((a,b)=>a==="#"?1:b==="#"?-1:coll.compare(a,b));}
function findKeys(d,q){
  const k=norm(q),m=maps[d],ks=keys[d],out=[],seen=new Set();
  if(!k)return out;
  if(m.has(k)&&has(m.get(k))){out.push(k);seen.add(k);}
  for(const x of ks){if(out.length>=60)break;if(!seen.has(x)&&x.startsWith(k)&&has(m.get(x))){out.push(x);seen.add(x);}}
  for(const x of ks){if(out.length>=60)break;if(!seen.has(x)&&x.includes(k)&&has(m.get(x))){out.push(x);seen.add(x);}}
  return out;}
const itemsOf=o=>o.items.filter(i=>!cat||i.c===cat);
/*LOGIC-END*/

/*XLSX-START*/
async function inflateRaw(u8){
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());}
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  let p=u8.length-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error("Bu .xlsx fayl emas");
  const n=dv.getUint16(p+10,true);let off=dv.getUint32(p+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    files[dec.decode(u8.subarray(off+46,off+46+nl))]={method,csize,lho};
    off+=46+nl+el+cl;}
  const get=async name=>{const f=files[name];if(!f)return null;const l=f.lho;
    const s=l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true);
    const data=u8.subarray(s,s+f.csize);
    return dec.decode(f.method===0?data:await inflateRaw(data));};
  return{get,names:Object.keys(files)};}
const unesc=s=>s.replace(/&(#x?[0-9a-f]+|amp|lt|gt|quot|apos);/gi,(m,g)=>{
  if(g[0]==="#"){const c=g[1].toLowerCase()==="x"?parseInt(g.slice(2),16):parseInt(g.slice(1),10);return String.fromCodePoint(c);}
  return{amp:"&",lt:"<",gt:">",quot:'"',apos:"'"}[g.toLowerCase()];});
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;}
function parseSheet(xml,ss){
  const rows=[];
  for(const rm of xml.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
    if(!rm[1])continue;const row=[];
    for(const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const at=cm[1],body=cm[2]||"",ref=/\br="([A-Z]+\d+)"/.exec(at),ty=/\bt="([^"]+)"/.exec(at);
      const i=ref?colIdx(ref[1]):row.length;let val="";
      if(ty&&ty[1]==="s"){const v=/<v>([\s\S]*?)<\/v>/.exec(body);val=v?(ss[+v[1]]||""):"";}
      else if(ty&&ty[1]==="inlineStr"){let t="";for(const tm of body.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g))t+=tm[1];val=unesc(t);}
      else{const v=/<v>([\s\S]*?)<\/v>/.exec(body);val=v?unesc(v[1]):"";}
      row[i]=val;}
    rows.push(row);}
  return rows;}
async function readXlsx(buf){
  const z=await unzip(buf);
  const wb=await z.get("xl/workbook.xml"),rels=await z.get("xl/_rels/workbook.xml.rels"),rmap={};
  if(rels)for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){
    const id=/\bId="([^"]+)"/.exec(m[0]),t=/\bTarget="([^"]+)"/.exec(m[0]);
    if(id&&t){let p=t[1].replace(/^\//,"");if(!p.startsWith("xl/"))p="xl/"+p;rmap[id[1]]=p;}}
  let list=[];
  if(wb)for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){
    const nm=/\bname="([^"]*)"/.exec(m[0]),id=/\br:id="([^"]+)"/.exec(m[0]);
    if(nm&&id&&rmap[id[1]])list.push({name:unesc(nm[1]),path:rmap[id[1]]});}
  list=list.filter(s=>z.names.includes(s.path));
  if(!list.length)list=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort().map((p,i)=>({name:"Lug'at "+(i+1),path:p}));
  if(!list.length)throw new Error("Varaq topilmadi");
  const ss=[],sx=await z.get("xl/sharedStrings.xml");
  if(sx)for(const m of sx.matchAll(/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g)){
    let t="";const body=(m[1]||"").replace(/<rPh\b[\s\S]*?<\/rPh>/g,"");
    for(const tm of body.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g))t+=tm[1];ss.push(unesc(t));}
  const out=[];
  for(const s of list)out.push({name:s.name,rows:parseSheet(await z.get(s.path),ss)});
  return out;}
function rowsToEntries(rows,c){
  const out=[],heads=["english","inglizcha","ingliz","en"];let first=true;
  for(const r of rows){
    const e=String(r[0]??"").trim(),u=String(r[1]??"").trim(),n=String(r[2]??"").trim();
    if(!e&&!u)continue;
    if(first){first=false;if(heads.includes(norm(e)))continue;}
    if(e&&u)out.push({e,u,n,c:c||"Umumiy"});}
  return out;}
/*XLSX-END*/

/* ================= SAQLASH (IndexedDB) ================= */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("tarjimon",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){try{const d=await idb();return await new Promise(res=>{
  const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch(e){return undefined;}}
async function kvSet(k,v){try{const d=await idb();return await new Promise((res,rej)=>{
  const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}

/* ================= HOLAT ================= */
const LN={en:"English",uz:"O'zbek"},LC={en:"en-US",uz:"uz-UZ"};
let dir=ls("dir","uz"),favs=ls("favs",[]),hist=ls("hist",[]),theme=ls("theme","auto"),fsz=ls("fsz",1);
cat=ls("cat","");
let dictInfo={time:0,src:"",err:""},cur="search",listShown=80,letter="",histT;

async function loadDict(manual){
  let buf=null,netFail=false,ok=false;
  try{const r=await fetch("lugat.xlsx?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;buf=await r.arrayBuffer();}
  catch(e){netFail=true;}
  if(netFail){
    dictInfo.err=entries.length?"":"lugat.xlsx fayli topilmadi yoki internet yo'q.";
    if(entries.length)dictInfo.src="saqlangan nusxa";
  }else{
    try{
      let data=[];for(const s of await readXlsx(buf))data=data.concat(rowsToEntries(s.rows,s.name));
      if(!data.length)throw new Error("EMPTY");
      entries=data;build();dictInfo={time:Date.now(),src:"fayl",err:""};ok=true;
      await kvSet("dict",{data,time:dictInfo.time});
    }catch(e){
      dictInfo.err=e.message==="EMPTY"?"lugat.xlsx bo'sh. A ustunga inglizcha, B ustunga o'zbekcha so'zlarni yozing.":"Excel faylni o'qib bo'lmadi: "+e.message;
      if(entries.length)dictInfo.src="saqlangan nusxa";}}
  if(manual)toast(ok?"✓ Lug'at yangilandi: "+entries.length+" ta qator":(entries.length?"Yangilab bo'lmadi, saqlangan nusxa ishlatilmoqda":"Lug'at yuklanmadi"));
  render();}

/* ================= KARTA ================= */
function speak(text,lang){try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){toast("Ovoz ishlamadi");}}
function card(d,k){
  const o=maps[d].get(k),fk=d+":"+k,its=itemsOf(o),showCat=cats.length>1&&!cat;
  const star=h("button",{class:"ib"+(favs.includes(fk)?" on":""),title:"Sevimli"},favs.includes(fk)?"★":"☆");
  star.onclick=()=>{const i=favs.indexOf(fk);
    if(i>=0){favs.splice(i,1);star.classList.remove("on");star.textContent="☆";}
    else{favs.unshift(fk);star.classList.add("on");star.textContent="★";}
    save("favs",favs);if(cur==="fav")renderFav();};
  return h("div",{class:"card"},
    h("div",{class:"w"},o.w),
    h("div",{class:"t"},its.map(i=>h("div",{class:"t1"},i.t,i.n?h("small",{}," · "+i.n):null,showCat?h("span",{class:"tag"},i.c):null))),
    h("div",{class:"acts"},
      h("button",{class:"ib",title:"Eshitish",onclick:()=>speak(o.w,LC[d])},"🔊"),
      h("button",{class:"ib",title:"Nusxa",onclick:async()=>{try{await navigator.clipboard.writeText(o.w+" — "+[...new Set(its.map(i=>i.t))].join(", "));toast("Nusxa olindi ✓");}catch(e){}}},"📋"),
      star));}
function emptyDict(){
  return h("div",{class:"warn"},dictInfo.err||"Lug'at yuklanmoqda...",
    dictInfo.err?h("div",{style:"margin-top:8px"},"GitHub'da index.html turgan joyga lugat.xlsx faylini yuklang."):null);}
function addHist(q){q=q.trim();if(!q)return;
  hist=hist.filter(x=>!(x.d===dir&&norm(x.q)===norm(q)));hist.unshift({d:dir,q});hist=hist.slice(0,50);save("hist",hist);}
function setDir(d){dir=d;save("dir",dir);dirLabel();}

/* ================= QIDIRUV ================= */
function lettersGrid(onpick){
  const g=h("div",{class:"letters"});
  lettersOf(dir,visibleKeys(dir)).forEach(x=>g.append(h("button",{class:"lt",onclick:()=>onpick(x)},x)));return g;}
function randomWord(){
  const v=visibleKeys(dir);if(!v.length)return;
  $("q").value=maps[dir].get(v[Math.floor(Math.random()*v.length)]).w;renderSearch();}
function renderSearch(){
  const box=$("results");box.replaceChildren();
  if(!entries.length){box.append(emptyDict());return;}
  const q=$("q").value;
  if(!norm(q)){
    box.append(h("div",{class:"hint"},LN[dir]+"cha so'z yozing yoki 🎤 bosing. Lug'atda "+visibleKeys(dir).length+" ta so'z bor."),
      h("button",{class:"btn sec",onclick:randomWord},"🎲 Tasodifiy so'z"),
      h("div",{class:"sec-t"},"Harf bo'yicha qidirish"),
      lettersGrid(x=>{letter=x;listShown=80;$("lf").value="";show("list");}));
    if(hist.length)box.append(h("div",{class:"sec-t"},"Oxirgi qidiruvlar"),
      h("div",{class:"chips"},hist.slice(0,8).map(x=>h("button",{class:"chip",onclick:()=>{setDir(x.d);$("q").value=x.q;renderSearch();}},x.q))));
    return;}
  const res=findKeys(dir,q);
  if(!res.length){
    box.append(h("div",{class:"hint"},"«"+q.trim()+"» topilmadi."));
    const alt=findKeys(other(dir),q);
    if(alt.length)box.append(h("button",{class:"btn sec",onclick:()=>{setDir(other(dir));renderSearch();}},"⇄ "+LN[other(dir)]+" tomondan "+alt.length+" ta natija bor"));
    return;}
  box.append(h("div",{class:"cnt"},res.length+" ta natija"));
  res.forEach(k=>box.append(card(dir,k)));}
$("q").oninput=()=>{renderSearch();clearTimeout(histT);histT=setTimeout(()=>{if(findKeys(dir,$("q").value).length)addHist($("q").value);},1500);};
$("q").onkeydown=e=>{if(e.key==="Enter"){e.target.blur();if($("q").value.trim())addHist($("q").value);}};
$("mic").onclick=()=>{
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return toast("Bu brauzerda ovoz yozish ishlamaydi");
  const r=new R();r.lang=LC[dir];
  r.onresult=e=>{$("q").value=e.results[0][0].transcript;renderSearch();addHist($("q").value);};
  r.onerror=()=>toast("Mikrofon ishlamadi");
  r.start();toast("Tinglayapman...");};

/* ================= LUG'AT RO'YXATI (harflar bo'yicha) ================= */
function renderList(){
  const box=$("lres"),L=$("letters");box.replaceChildren();L.replaceChildren();
  if(!entries.length){box.append(emptyDict());$("lcnt").textContent="";return;}
  const base=visibleKeys(dir),letters=lettersOf(dir,base);
  if(letter&&!letters.includes(letter))letter="";
  L.append(h("button",{class:"lt"+(!letter?" act":""),onclick:()=>{letter="";listShown=80;renderList();}},"Hammasi"));
  letters.forEach(x=>L.append(h("button",{class:"lt"+(letter===x?" act":""),onclick:()=>{letter=x;listShown=80;renderList();}},x)));
  const f=norm($("lf").value);let all=base;
  if(letter)all=all.filter(k=>letterOf(dir,k)===letter);
  if(f)all=all.filter(k=>k.includes(f));
  $("lcnt").textContent=LN[dir]+" → "+LN[other(dir)]+(letter?" · «"+letter+"» harfi":"")+": "+all.length+" ta so'z";
  all.slice(0,listShown).forEach(k=>box.append(card(dir,k)));
  if(all.length>listShown)box.append(h("button",{class:"btn sec",onclick:()=>{listShown+=80;renderList();}},"Ko'proq ko'rsatish ("+(all.length-listShown)+")"));}
$("lf").oninput=()=>{listShown=80;renderList();};

/* ================= SEVIMLI / TARIX ================= */
function renderFav(){
  const box=$("fres");box.replaceChildren();
  const items=favs.map(f=>{const i=f.indexOf(":");return{d:f.slice(0,i),k:f.slice(i+1)};}).filter(x=>maps[x.d]&&maps[x.d].has(x.k));
  if(!items.length){box.append(h("div",{class:"hint"},"Hozircha sevimli so'zlar yo'q. So'z kartasidagi ☆ tugmasini bosing."));return;}
  box.append(h("div",{class:"cnt"},items.length+" ta sevimli so'z"));
  items.forEach(x=>box.append(card(x.d,x.k)));}
function renderHist(){
  const box=$("hres");box.replaceChildren();
  if(!hist.length){box.append(h("div",{class:"hint"},"Qidiruv tarixi bo'sh."));return;}
  hist.forEach(x=>box.append(h("div",{class:"card",style:"cursor:pointer",onclick:()=>{setDir(x.d);$("q").value=x.q;show("search");}},
    h("div",{class:"w"},x.q),h("div",{class:"cnt",style:"margin:4px 0 0"},LN[x.d]+" → "+LN[other(x.d)]))));
  box.append(h("button",{class:"btn sec",onclick:()=>{if(confirm("Tarixni tozalaysizmi?")){hist=[];save("hist",hist);renderHist();}}},"🗑 Tarixni tozalash"));}

/* ================= SOZLAMA ================= */
function applyTheme(){
  const dark=theme==="dark"||(theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark",dark);
  document.documentElement.style.setProperty("--fs",fsz);}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);}catch(e){}
function sel(opts,val,fn){const s=h("select",{});opts.forEach(([v,t])=>{const o=h("option",{value:v},t);if(String(v)===String(val))o.selected=true;s.append(o);});s.onchange=()=>fn(s.value);return s;}
async function hardRefresh(){
  try{if(window.caches)for(const k of await caches.keys())await caches.delete(k);
    const rs=(await navigator.serviceWorker?.getRegistrations?.())||[];for(const r of rs)await r.unregister();}catch(e){}
  location.reload();}
function renderSet(){
  const box=$("sres");box.replaceChildren();
  const when=dictInfo.time?new Date(dictInfo.time).toLocaleString("uz-UZ"):"—";
  box.append(
    h("div",{class:"sec-t"},"Lug'at"),
    h("div",{class:"card"},
      h("div",{class:"kv"},h("span",{},"Jami qatorlar"),h("span",{},String(entries.length))),
      h("div",{class:"kv"},h("span",{},"Inglizcha so'zlar"),h("span",{},String(keys.en.length))),
      h("div",{class:"kv"},h("span",{},"O'zbekcha so'zlar"),h("span",{},String(keys.uz.length))),
      h("div",{class:"kv"},h("span",{},"Manba"),h("span",{},dictInfo.src==="fayl"?"lugat.xlsx":(dictInfo.src||"—"))),
      h("div",{class:"kv"},h("span",{},"Oxirgi yangilanish"),h("span",{},when))),
    cats.length>1?h("div",{class:"sec-t"},"Lug'atlar (Excel varaqlari)"):null,
    cats.length>1?h("div",{class:"card"},cats.map(c=>h("div",{class:"kv"},h("span",{},c),h("span",{},catCount[c]+" ta")))):null,
    dictInfo.err?h("div",{class:"warn"},dictInfo.err):null,
    h("button",{class:"btn",onclick:()=>loadDict(true)},"🔄 Lug'atni yangilash"),
    h("div",{class:"sec-t"},"Ko'rinish"),
    h("div",{class:"card"},
      h("div",{class:"kv"},h("span",{},"Mavzu"),sel([["auto","Avto"],["light","Yorug'"],["dark","Qorong'i"]],theme,v=>{theme=v;save("theme",v);applyTheme();})),
      h("div",{class:"kv"},h("span",{},"Harf o'lchami"),sel([[0.9,"Kichik"],[1,"O'rta"],[1.15,"Katta"],[1.3,"Juda katta"]],fsz,v=>{fsz=+v;save("fsz",fsz);applyTheme();}))),
    h("div",{class:"sec-t"},"Ma'lumotlar"),
    h("button",{class:"btn sec",onclick:()=>{if(confirm("Sevimlilarni tozalaysizmi?")){favs=[];save("favs",favs);toast("Tozalandi");}}},"⭐ Sevimlilarni tozalash"),
    h("button",{class:"btn sec",onclick:()=>{if(confirm("Tarixni tozalaysizmi?")){hist=[];save("hist",hist);toast("Tozalandi");}}},"🕘 Tarixni tozalash"),
    h("button",{class:"btn sec",onclick:hardRefresh},"♻️ Ilovani yangilash (keshni tozalash)"),
    h("div",{class:"hint"},"Lug'at lugat.xlsx faylidan olinadi: A ustun — inglizcha, B ustun — o'zbekcha, C ustun — izoh (ixtiyoriy). Har bir Excel varag'i alohida lug'at hisoblanadi. Fayl yangilansa, ilova ochilganda internet orqali avtomatik yangilanadi va keyin internetsiz ham ishlaydi."));}

/* ================= NAVIGATSIYA ================= */
function dirLabel(){$("dirBtn").textContent=LN[dir]+" → "+LN[other(dir)]+" ⇄";}
function swapDir(){
  let moved=false;
  if(cur==="search"){const q=$("q").value;
    if(norm(q)){const r=findKeys(dir,q);
      if(r.length){const its=itemsOf(maps[dir].get(r[0]));if(its.length){$("q").value=its[0].t;moved=true;}}}}
  setDir(other(dir));letter="";listShown=80;render();
  if(moved)toast("So'z almashtirildi");}
$("dirBtn").onclick=swapDir;
function renderCats(){
  const b=$("catBar");b.replaceChildren();
  const on=cats.length>1&&(cur==="search"||cur==="list");b.hidden=!on;if(!on)return;
  [["","Hammasi"],...cats.map(c=>[c,c])].forEach(([v,t])=>b.append(
    h("button",{class:"chip"+(cat===v?" act":""),onclick:()=>{cat=v;save("cat",cat);letter="";listShown=80;render();}},t)));}
function render(){renderCats();({search:renderSearch,list:renderList,fav:renderFav,hist:renderHist,set:renderSet})[cur]();}
function show(v){cur=v;
  document.querySelectorAll(".view").forEach(s=>s.hidden=s.id!=="v-"+v);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("act",b.dataset.v===v));
  render();window.scrollTo(0,0);}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ================= BOSHLASH ================= */
(async()=>{
  applyTheme();dirLabel();show("search");
  const c=await kvGet("dict");
  if(c&&c.data&&c.data.length){entries=c.data.map(x=>({...x,c:x.c||"Umumiy"}));build();dictInfo={time:c.time,src:"saqlangan nusxa",err:""};render();}
  loadDict(false);
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
